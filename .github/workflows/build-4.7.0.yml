name: Build 4.7.0

on:
  workflow_dispatch:
  push:
    branches:
      - "fix-host-longest-match-4.7.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote close diagnostics to Info
        shell: powershell
        run: |
          $files = @(
            '.\shadowsocks-csharp\Controller\Local.cs',
            '.\shadowsocks-csharp\Controller\ProxyAuth.cs',
            '.\shadowsocks-csharp\Controller\Socks5Forwarder.cs'
          )
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          foreach ($file in $files) {
            $text = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)
            $text = $text.Replace('Logging.Debug("[CloseDiag]', 'Logging.Info("[CloseDiag]')
            $text = $text.Replace('Logging.Debug($"[CloseDiag]', 'Logging.Info($"[CloseDiag]')
            [System.IO.File]::WriteAllText($file, $text, $utf8NoBom)
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: powershell
        run: |
          msbuild .\shadowsocks-csharp\shadowsocks-csharp.csproj /t:Build /p:Configuration=Release /m

      - name: Package build output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item .\shadowsocks-csharp\bin\2.0\Release\* .\artifact\ -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowsocksR-4.7.0-host-longest-match
          path: artifact
          if-no-files-found: error
