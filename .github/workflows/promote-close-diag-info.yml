name: Promote close diagnostics to Info

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-host-longest-match-4.7.0

      - name: Promote close diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('shadowsocks-csharp/Controller/Local.cs'),
              Path('shadowsocks-csharp/Controller/ProxyAuth.cs'),
              Path('shadowsocks-csharp/Controller/Socks5Forwarder.cs'),
          ]
          changed = False
          for path in files:
              text = path.read_text(encoding='utf-8')
              new = text.replace('Logging.Debug("[CloseDiag]', 'Logging.Info("[CloseDiag]')
              new = new.replace('Logging.Debug($"[CloseDiag]', 'Logging.Info($"[CloseDiag]')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed = True
          if not changed:
              raise SystemExit('No CloseDiag Debug logging found; refusing a no-op commit.')
          PY

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowsocks-csharp/Controller/Local.cs shadowsocks-csharp/Controller/ProxyAuth.cs shadowsocks-csharp/Controller/Socks5Forwarder.cs
          git commit -m "Promote close diagnostics to Info"
          git push origin HEAD:fix-host-longest-match-4.7.0

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/promote-close-diag-info.yml
          git commit -m "Remove temporary diagnostics workflow"
          git push origin HEAD:fix-host-longest-match-4.7.0
