name: Build Fix-user.rule (.NET 2.0 / 4.0)

on:
  push:
    branches:
      - Fix-user.rule
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET ${{ matrix.dotnet }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "2.0"
            project: "shadowsocks-csharp/shadowsocks-csharp.csproj"
            output: "shadowsocks-csharp/bin/2.0/Release"
            artifact: "ShadowsocksR-Fix-user.rule-net2.0"
          - dotnet: "4.0"
            project: "shadowsocks-csharp/shadowsocks-csharp4.0.csproj"
            output: "shadowsocks-csharp/bin/4.0/Release"
            artifact: "ShadowsocksR-Fix-user.rule-net4.0"

    steps:
      - name: Checkout Fix-user.rule
        uses: actions/checkout@v4
        with:
          ref: Fix-user.rule
          fetch-depth: 1

      - name: Add Microsoft .NET Framework reference assemblies
        shell: pwsh
        run: |
          @'
          <Project>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="All" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Path "Directory.Build.props" -Encoding UTF8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore reference assemblies
        shell: pwsh
        run: |
          msbuild "${{ matrix.project }}" `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /verbosity:minimal

      - name: Build
        shell: pwsh
        run: |
          msbuild "${{ matrix.project }}" `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /m `
            /verbosity:minimal

      - name: Verify output
        shell: pwsh
        run: |
          $dir = "${{ matrix.output }}"
          $exe = Join-Path $dir "ShadowsocksR.exe"
          $config = Join-Path $dir "ShadowsocksR.exe.config"

          if (-not (Test-Path $exe)) {
            Write-Host "Build directory:"
            Get-ChildItem $dir -Force | Format-Table Name, Length
            throw "ShadowsocksR.exe was not produced."
          }

          if (-not (Test-Path $config)) {
            Write-Host "Build directory:"
            Get-ChildItem $dir -Force | Format-Table Name, Length
            throw "ShadowsocksR.exe.config was not produced."
          }

          Write-Host "Built files:"
          Get-Item $exe, $config | Format-Table Name, Length, LastWriteTime

      - name: Prepare artifact
        shell: pwsh
        run: |
          $dir = "${{ matrix.output }}"
          $package = "artifact-${{ matrix.dotnet }}"
          New-Item -ItemType Directory -Force $package | Out-Null

          Copy-Item (Join-Path $dir "ShadowsocksR.exe") $package
          Copy-Item (Join-Path $dir "ShadowsocksR.exe.config") $package

      - name: Upload executable and config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact-${{ matrix.dotnet }}
          if-no-files-found: error
          retention-days: 30
