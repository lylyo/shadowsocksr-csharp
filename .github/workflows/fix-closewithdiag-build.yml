name: Fix close diagnostics compile

on:
  push:
    branches:
      - "fix-host-longest-match-4.7.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Fix CloseWithDiag compile error'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-host-longest-match-4.7.0

      - name: Fix invalid Socket call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shadowsocks-csharp/Controller/ProxyAuth.cs')
          text = p.read_text(encoding='utf-8-sig')
          old = 's.CloseWithDiag();'
          new = 's.Close();'
          if old not in text:
              raise SystemExit('Expected invalid Socket.CloseWithDiag() call not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowsocks-csharp/Controller/ProxyAuth.cs
          git commit -m "Fix CloseWithDiag compile error"
          git push origin HEAD:fix-host-longest-match-4.7.0

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-closewithdiag-build.yml
          git commit -m "Remove temporary close diagnostics fix workflow"
          git push origin HEAD:fix-host-longest-match-4.7.0
